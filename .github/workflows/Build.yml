name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  schedule:
    # Monthly rebuild to pick up Debian security updates in the base image
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive image name and version tag from Dockerfile
        id: meta
        run: |
          pg=$(grep -oP '^FROM postgres:\K[0-9.]+' Dockerfile)
          vc=$(grep -oP '^FROM tensorchord/vchord-scratch:pg18-v\K[0-9.]+' Dockerfile)
          echo "version=${pg}-vchord${vc}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:pg18
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}